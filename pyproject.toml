[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memnest-mcp"
version = "0.3.1"
description = "Persistent graph memory MCP server for AI agents using LadybugDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "arunkse" }
]
keywords = ["mcp", "memory", "agent", "ladybugdb", "graph", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "fastembed>=0.3.0",
    "real-ladybug>=0.15.0",
    # toon-format is a beta dependency. Pin to a known-good version to avoid
    # silent API drift from upstream beta releases.
    "toon-format==0.9.0b1",
]

[project.urls]
Homepage = "https://github.com/arunkumars-mf/memnest-mcp"
Repository = "https://github.com/arunkumars-mf/memnest-mcp"
Issues = "https://github.com/arunkumars-mf/memnest-mcp/issues"

[project.scripts]
memnest-mcp = "memnest_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memnest_mcp"]
